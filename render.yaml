services:
  # ========================================================
  # BACKEND SERVICE (Spring Boot in Docker)
  # ========================================================
  - type: web
    name: student-backend
    runtime: docker
    dockerfilePath: ./student/Dockerfile
    dockerContext: ./student
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: student-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: student-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-db
          property: password

  # ========================================================
  # FRONTEND STATIC SITE (React + Vite SPA)
  # ========================================================
  - type: web
    name: student-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: student-backend
          property: host

# ========================================================
# MANAGED POSTGRESQL DATABASE
# ========================================================
databases:
  - name: student-db
    databaseName: db_user
    plan: free
    region: oregon
